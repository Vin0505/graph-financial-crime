model:
  name: xgboost
  objective: binary:logistic
  eval_metric: aucpr
  tree_method: hist
  n_estimators: 300
  random_state: 42
  n_jobs: -1

tuning:
  selection_metric: average_precision
  trials:
    - name: trial_01_baseline_shallow
      max_depth: 3
      learning_rate: 0.05
      min_child_weight: 1
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0
      scale_pos_weight: 1.0

    - name: trial_02_baseline_medium
      max_depth: 5
      learning_rate: 0.05
      min_child_weight: 1
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0
      scale_pos_weight: 1.0

    - name: trial_03_baseline_deep
      max_depth: 7
      learning_rate: 0.05
      min_child_weight: 1
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0
      scale_pos_weight: 1.0

    - name: trial_04_weighted_shallow
      max_depth: 3
      learning_rate: 0.05
      min_child_weight: 1
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0
      scale_pos_weight: train_ratio

    - name: trial_05_weighted_medium
      max_depth: 5
      learning_rate: 0.05
      min_child_weight: 1
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0
      scale_pos_weight: train_ratio

    - name: trial_06_weighted_regularised
      max_depth: 5
      learning_rate: 0.05
      min_child_weight: 5
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 5.0
      scale_pos_weight: train_ratio
